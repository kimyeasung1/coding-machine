<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>코딩 머신</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout: 4:3 무대. 왼쪽 터미널(목표 출력값, 입력 배열, 실행 기록), 오른쪽 목표 탭과 입력어 칩. 크기는 --u(무대 너비의 1%)로 비례, 세로 좁은 화면은 쌓음 */
:root{
  --bg:#eaf1ee; --paper:#f8fbf9; --ink:#1f2f2b; --muted:#5d716b; --grid:#c5d6d0; --wall:#3b4b47;
  --accent:#e5622b; --accent-ink:#fff; --chip:#dbe8e3; --pick:#e5622b;
  --term-bg:#16231f; --term-fg:#d9efe6; --term-dim:#86a69b; --ok:#6ee0a8; --bad:#ff8c8c; --goal:#ffd166;
  --font-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gaegu','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo','Malgun Gothic',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12201c; --paper:#1a2c27; --ink:#e6f1ed; --muted:#9db3ac; --grid:#2f4740; --wall:#8fa7a0;
  --accent:#ff8a57; --accent-ink:#1a1209; --chip:#26403a; --pick:#ff8a57;
  --term-bg:#0b1411; --term-fg:#d9efe6; --term-dim:#7d9c91; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12201c; --paper:#1a2c27; --ink:#e6f1ed; --muted:#9db3ac; --grid:#2f4740; --wall:#8fa7a0;
  --accent:#ff8a57; --accent-ink:#1a1209; --chip:#26403a; --pick:#ff8a57;
  --term-bg:#0b1411; --term-fg:#d9efe6; --term-dim:#7d9c91; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0;
  padding-inline:16px;padding-block:12px;display:grid;place-items:center}

.stage{container-type:inline-size;
  width:min(100%,calc((100dvh - 24px) * 4 / 3));aspect-ratio:4/3;
  display:grid;grid-template-columns:56fr 44fr;gap:calc(var(--u) * 2.2);padding:calc(var(--u) * 2);
  border:2px solid var(--grid);border-radius:calc(var(--u) * 1);background:var(--bg);overflow:hidden}
.stage > *{--u:1cqw;min-width:0;min-height:0}

.term{display:flex;flex-direction:column;background:var(--term-bg);color:var(--term-fg);
  border:calc(var(--u) * .3) solid var(--wall);border-radius:calc(var(--u) * 1);overflow:hidden}
.bar{display:flex;align-items:center;padding:calc(var(--u) * .9) calc(var(--u) * 1.5);
  font-family:var(--font-display);font-size:calc(var(--u) * 2.6);background:var(--paper);color:var(--ink);border-bottom:2px solid var(--wall)}
.bar small{font-family:var(--font-body);font-size:calc(var(--u) * 1.8);color:var(--muted);margin-left:auto}
.goalbox{padding:calc(var(--u) * 1.3) calc(var(--u) * 1.5);border-bottom:1px dashed var(--term-dim)}
.goalbox .lab{font-family:var(--font-mono);font-size:calc(var(--u) * 1.6);color:var(--term-dim)}
.goalbox .val{font-family:var(--font-display);font-size:calc(var(--u) * 4);color:var(--goal);line-height:1.15;margin-top:calc(var(--u) * .3)}
.codebox{padding:calc(var(--u) * 1.1) calc(var(--u) * 1.5);font-family:var(--font-mono);font-size:calc(var(--u) * 1.9);line-height:1.45;border-bottom:1px dashed var(--term-dim);overflow-wrap:anywhere}
.codebox .k{color:var(--term-dim)}
.codebox .empty{color:var(--term-dim)}
.log{flex:1 1 auto;overflow:auto;padding:calc(var(--u) * 1.2) calc(var(--u) * 1.5);font-family:var(--font-mono);font-size:calc(var(--u) * 1.9);line-height:1.45;
  display:flex;flex-direction:column;gap:calc(var(--u) * 1);min-height:0}
.entry{display:flex;flex-direction:column;gap:calc(var(--u) * .1);overflow-wrap:anywhere}
.entry .in{color:var(--term-dim)}
.entry .out{color:var(--bad)}
.entry .why{color:var(--term-dim);font-size:.92em}
.entry.win .out{color:var(--ok);font-family:var(--font-display);font-size:calc(var(--u) * 3);line-height:1.2}
.hello{color:var(--term-dim)}

.side{display:flex;flex-direction:column;gap:calc(var(--u) * 1.2);min-height:0}
.tabs{display:flex;gap:calc(var(--u) * .7)}
.tab{flex:1;font-family:var(--font-display);font-size:calc(var(--u) * 2);padding:calc(var(--u) * .8) calc(var(--u) * .5);border-radius:10px;
  border:2px solid var(--grid);background:var(--paper);color:var(--ink);cursor:pointer;line-height:1.15}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{margin:0;color:var(--muted);font-size:calc(var(--u) * 1.9);line-height:1.3}
.chips{flex:1 1 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--u) * .8);align-content:start;min-height:0;overflow:auto}
.chip{font-family:var(--font-display);font-size:calc(var(--u) * 2.2);padding:calc(var(--u) * .9) calc(var(--u) * 1);border-radius:12px;
  border:2px solid var(--grid);background:var(--paper);color:var(--ink);cursor:pointer;text-align:left;line-height:1.15}
.chip[aria-pressed="true"]{border-color:var(--pick);background:var(--chip);box-shadow:inset 0 0 0 2px var(--pick)}
.chip.reveal{outline:3px dashed var(--ok);outline-offset:1px}
.actions{display:flex;gap:calc(var(--u) * .8);flex-wrap:wrap}
.actions button{font-family:var(--font-display);font-size:calc(var(--u) * 2.3);padding:calc(var(--u) * .9) calc(var(--u) * 2);border-radius:999px;
  border:2px solid var(--wall);background:var(--paper);color:var(--ink);cursor:pointer}
.actions .run{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.actions .ghost{border-style:dashed;color:var(--muted);font-size:calc(var(--u) * 1.8)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

@media (max-aspect-ratio:1/1),(max-width:640px){
  html,body{height:auto}
  body{display:block;padding-block:16px 28px}
  .stage{width:100%;max-width:560px;margin:0 auto;aspect-ratio:auto;display:flex;flex-direction:column;border:0;padding:0;overflow:visible;--u:5.6px}
  .stage > *{--u:5.6px}
  .term{height:430px}
  .chips{overflow:visible}
}
</style>

<div class="stage">
  <div class="term">
    <div class="bar">코딩 머신 <small id="tries">시도 0회</small></div>
    <div class="goalbox">
      <div class="lab">목표 출력값</div>
      <div class="val" id="goal"></div>
    </div>
    <div class="codebox" id="code"></div>
    <div class="log" id="log" aria-live="polite">
      <div class="hello">입력어를 골라 조합한 뒤 실행을 누르세요.</div>
    </div>
  </div>

  <div class="side">
    <div class="tabs" id="tabs" role="tablist" aria-label="목표 선택"></div>
    <p class="note">필요한 입력어를 모두 넣고, 필요 없는 입력어는 빼야 해요. 순서는 상관없어요.</p>
    <div class="chips" id="chips"></div>
    <div class="actions">
      <button id="run" class="run" type="button">▶ 실행</button>
      <button id="clear" type="button">비우기</button>
      <button id="peek" class="ghost" type="button" aria-pressed="false">정답 보기</button>
    </div>
  </div>
</div>

<script>
(function(){
  /* need: 반드시 필요한 입력어 5개, 나머지는 섞이면 안 되는 입력어 */
  var GOALS=[
    {tab:"공부 1등",goal:"우리 반 공부 1등",
     need:["매일 예습","매일 복습","숙제 성실히 제출","오답노트","8시간 수면"],
     no:["밤새우기","벼락치기","학원 5개 추가","게임 3시간","군것질, 야식"]},
    {tab:"달리기 1등",goal:"반 대표 달리기 1등",
     need:["달리기 자세 연습","줄넘기 매일","균형 잡힌 식단","스트레칭","8시간 수면"],
     no:["늦게 자고 늦게 일어나기","탄산음료","야식","슬리퍼 신고 연습","점심 굶기"]},
    {tab:"게임 레벨 99",goal:"게임 레벨 99 달성 (만렙)",
     need:["튜토리얼 완료","일일 퀘스트","전설 장비 획득","길드 가입","물약과 음식 넉넉히 준비"],
     no:["핵 프로그램 사용","계정 공유","레벨 구매","일주일 쉬기","도움말 무시"]}
  ];
  /* 목표를 고를 때마다 칩 위치를 무작위로 섞어 정답이 한쪽에 몰리지 않게 함 */
  var order=[];
  function shuffle(){
    var n=GOALS[cur].need.length+GOALS[cur].no.length;
    order=[];for(var k=0;k<n;k++)order.push(k);
    for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  }
  var cur=0,sel={},tries=0,peek=false;
  var logEl=document.getElementById('log'),codeEl=document.getElementById('code'),
      chipsEl=document.getElementById('chips'),tabsEl=document.getElementById('tabs'),
      goalEl=document.getElementById('goal'),triesEl=document.getElementById('tries');

  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
  function items(g){var all=g.need.concat(g.no);return order.map(function(i){return all[i];});}
  function picked(){return Object.keys(sel).filter(function(k){return sel[k];});}

  function drawTabs(){
    tabsEl.innerHTML="";
    GOALS.forEach(function(g,i){
      var b=document.createElement('button');b.type="button";b.className="tab";b.setAttribute('role','tab');
      b.setAttribute('aria-selected',i===cur?"true":"false");b.textContent=g.tab;
      b.onclick=function(){setGoal(i);};tabsEl.appendChild(b);
    });
  }
  function drawChips(){
    var g=GOALS[cur];chipsEl.innerHTML="";
    items(g).forEach(function(name){
      var b=document.createElement('button');b.type="button";b.className="chip";
      b.setAttribute('aria-pressed',sel[name]?"true":"false");b.textContent=name;
      if(peek&&g.need.indexOf(name)!==-1)b.className+=" reveal";
      b.onclick=function(){sel[name]=!sel[name];drawChips();drawCode();};
      chipsEl.appendChild(b);
    });
  }
  function drawCode(){
    var p=picked();
    codeEl.innerHTML='<span class="k">입력 = </span>'+(p.length?'['+p.map(esc).join(', ')+']':'<span class="empty">[ 비어 있음 ]</span>')+
      '<br><span class="k">출력 = 실행(입력)</span>';
  }
  function setGoal(i){
    cur=i;sel={};peek=false;shuffle();document.getElementById('peek').setAttribute('aria-pressed','false');
    goalEl.textContent=GOALS[i].goal;
    logEl.innerHTML='<div class="hello">입력어를 골라 조합한 뒤 실행을 누르세요.</div>';
    drawTabs();drawChips();drawCode();
  }
  function run(){
    var g=GOALS[cur],p=picked();
    if(!p.length){addEntry([],null,"입력이 비어 있어요. 입력어를 먼저 고르세요.","");return;}
    tries++;triesEl.textContent="시도 "+tries+"회";
    var hit=p.filter(function(n){return g.need.indexOf(n)!==-1;}).length;
    var wrong=p.length-hit;
    if(hit===g.need.length&&wrong===0){addEntry(p,true,g.goal,"");}
    else{addEntry(p,false,"null (목표를 만들지 못함)","필요한 입력 "+hit+"/"+g.need.length+" 충족 · 섞인 불필요 입력 "+wrong+"개");}
  }
  function addEntry(p,win,out,why){
    var e=document.createElement('div');e.className="entry"+(win?" win":"");
    e.innerHTML='<div class="in">실행(['+p.map(esc).join(', ')+'])</div><div class="out">'+(win?'출력: '+esc(out)+' ✔':'출력: '+esc(out))+'</div>'+(why?'<div class="why">'+esc(why)+'</div>':'');
    var h=logEl.querySelector('.hello');if(h)h.remove();
    logEl.appendChild(e);logEl.scrollTop=logEl.scrollHeight;
  }
  document.getElementById('run').onclick=run;
  document.getElementById('clear').onclick=function(){sel={};drawChips();drawCode();};
  document.getElementById('peek').onclick=function(){
    peek=!peek;this.setAttribute('aria-pressed',peek?"true":"false");drawChips();
  };
  setGoal(0);
})();
</script>

</body></html>
